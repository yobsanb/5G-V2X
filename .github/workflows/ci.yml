name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install CPU PyTorch first
        # The default index would pull the multi-gigabyte CUDA build, which the
        # runner neither needs nor has room for.
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          pip install ruff
          ruff check --select F,I,E9 --line-length 110 v2x_edge tools scripts test

      - name: Tests
        # Every test builds its models from config, so no weights are downloaded.
        env:
          HF_HUB_OFFLINE: "1"
        run: pytest

      - name: Model smoke test
        env:
          HF_HUB_OFFLINE: "1"
        run: python tools/check_models.py

      - name: Synthetic RSU to OBU demo
        run: python scripts/run_synthetic_demo.py
